spring:
  application:
    name: hivemind
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: hivemind-triage
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hivemind}
    username: ${DATABASE_USERNAME:hivemind}
    password: ${DATABASE_PASSWORD:hivemind}
  flyway:
    enabled: true

server:
  port: 8080

management:
  tracing:
    sampling:
      # 100% for a low-traffic portfolio demo — a real deployment would sample well below 1.0.
      probability: 1.0
  otlp:
    tracing:
      # Jaeger's OTLP HTTP receiver (see docker-compose.yml). If Jaeger isn't running, span export
      # here just fails and logs a warning per batch — it doesn't affect request handling, since
      # OTel's span processor exports asynchronously. LoggingSpanExporter (TracingConfig) stays
      # registered alongside this one, so `./mvnw test`/local runs without docker-compose still get
      # spans as log lines with zero extra infra.
      endpoint: ${HIVEMIND_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

hivemind:
  platform:
    default-vertical: triage
  llm:
    provider: anthropic
    model: claude-sonnet-5
    api-key: ${ANTHROPIC_API_KEY:}
    max-tokens: 1024
    retry:
      max-attempts: 3
      base-backoff-ms: 500
    pricing:
      # Placeholders, not verified published pricing for `model` above — update to the real rate
      # before trusting the dollar figures for anything beyond exercising the cost-per-ticket gate.
      input-cost-per-million-tokens: 3.00
      output-cost-per-million-tokens: 15.00
  tool:
    timeout-ms: 5000
    retry:
      max-attempts: 3
      base-backoff-ms: 200
  eval:
    cases-dir: evals
    thresholds:
      category-accuracy: 0.85
      citation-recall: 0.70
      tone-min-avg: 4.0
      p95-latency-ms: 8000
      cost-per-ticket-usd: 0.05
