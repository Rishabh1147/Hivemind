spring:
  application:
    name: hivemind
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: hivemind-triage
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hivemind}
    username: ${DATABASE_USERNAME:hivemind}
    password: ${DATABASE_PASSWORD:hivemind}
  flyway:
    enabled: true

server:
  port: 8080

management:
  tracing:
    sampling:
      # 100% for a low-traffic portfolio demo — a real deployment would sample well below 1.0.
      probability: 1.0
  otlp:
    tracing:
      # Jaeger's OTLP HTTP receiver (see docker-compose.yml). If Jaeger isn't running, span export
      # here just fails and logs a warning per batch — it doesn't affect request handling, since
      # OTel's span processor exports asynchronously. LoggingSpanExporter (TracingConfig) stays
      # registered alongside this one, so `./mvnw test`/local runs without docker-compose still get
      # spans as log lines with zero extra infra.
      endpoint: ${HIVEMIND_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized

hivemind:
  platform:
    default-vertical: triage
  llm:
    provider: anthropic
    # Haiku by default: this is an individual-budget project in active iterative dev, not an
    # org-funded one, and Haiku is more than capable of exercising the pipeline/eval mechanics for
    # that. Override to a stronger model (e.g. claude-sonnet-5) via HIVEMIND_LLM_MODEL for a demo run
    # where response quality itself is what's being judged — and update the pricing rates below to
    # match if you do, since they're real numbers for whichever model is actually configured here,
    # not auto-derived from it.
    model: ${HIVEMIND_LLM_MODEL:claude-haiku-4-5-20251001}
    api-key: ${ANTHROPIC_API_KEY:}
    max-tokens: 1024
    retry:
      max-attempts: 3
      base-backoff-ms: 500
    pricing:
      # Real, verified Claude Haiku 4.5 pricing (anthropic.com/claude/haiku, checked 2026-08-12) — the
      # first non-placeholder numbers here since this field was added session 14. These are correct
      # for the default model above; if `model` changes, these must change with it (see the note
      # there) or the cost-per-ticket figures this feeds will quietly be wrong for a different model.
      input-cost-per-million-tokens: 1.00
      output-cost-per-million-tokens: 5.00
  tool:
    timeout-ms: 5000
    retry:
      max-attempts: 3
      base-backoff-ms: 200
  eval:
    cases-dir: evals
    thresholds:
      category-accuracy: 0.85
      citation-recall: 0.70
      tone-min-avg: 4.0
      p95-latency-ms: 8000
      cost-per-ticket-usd: 0.05
